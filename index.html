<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#003D4D" />
<title>FDC — Ejecución PDV</title>
<meta name="description" content="Checklist de ejecución en punto de venta — Flor de Caña" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <noscript>Esta app necesita JavaScript habilitado para funcionar.</noscript>
  <div id="app" role="main" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {
          /* si falla el registro del service worker, la app sigue funcionando online */
        });
      });
    }
  </script>
</body>
</html>
